name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - run: ./scripts/patch-android.sh
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: volley-vault-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to apk-builds branch
        run: |
          mkdir /tmp/out && cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/out/volley-vault-debug.apk
          git config user.name github-actions && git config user.email actions@github.com
          git checkout --orphan apk-builds && git rm -rf . -q
          cp /tmp/out/volley-vault-debug.apk . && git add volley-vault-debug.apk
          git commit -qm "APK build ${GITHUB_SHA::7}" && git push -f origin apk-builds
